<!--
  PEGA ESTE BLOQUE PRIMERO, dentro de un widget "HTML" de Elementor Pro,
  arriba del todo en la página de opt-in.

  Justo DEBAJO de este widget, en el mismo lugar, inserta tu propio
  widget de Formulario (el que uses para capturar el correo — Elementor
  Form, Mailchimp, etc.). Luego pega el segundo bloque
  (wordpress-html-widget-1b-copy.html) debajo de eso.

  Este bloque trae el <style> completo de la página — no hace falta
  repetirlo en el segundo bloque, ya queda cargado para toda la página.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;0,700;0,900;1,500;1,600&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0908;
    --bg-panel: #14100c;
    --border: #2b241b;
    --ink: #f3efe6;
    --ink-dim: #a89f8f;
    --ink-dimmer: #71685a;
    --gold: #d7ac57;
    --gold-bright: #f2cc7c;
    --gold-ink: #17130b;
    --green: #46cf94;
    --green-bg: #10251c;
    --green-border: #204a34;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  img { max-width: 100%; display: block; }
  a { color: inherit; }

  .wrap { max-width: 720px; margin: 0 auto; padding: 0 20px; }

  /* NAV */
  .nav {
    border-bottom: 1px solid var(--border);
    padding: 18px 0;
  }
  .nav .wrap { max-width: 900px; display: flex; align-items: center; justify-content: space-between; }
  .nav .brand { font-weight: 800; font-size: 14px; letter-spacing: 1.5px; text-transform: uppercase; }
  .nav .brand span { color: var(--gold); }
  .nav .tag { font-size: 11px; color: var(--ink-dimmer); font-weight: 600; letter-spacing: 0.5px; text-transform: uppercase; }

  /* HERO */
  .hero { position: relative; padding: 64px 0 40px; text-align: center; overflow: hidden; }
  .hero::before {
    content: ""; position: absolute; top: -280px; left: 50%; transform: translateX(-50%);
    width: 640px; height: 640px; border-radius: 50%; pointer-events: none; z-index: 0;
    background: radial-gradient(circle, rgba(215,172,87,0.20) 0%, rgba(215,172,87,0) 68%);
  }
  .hero > * { position: relative; z-index: 1; }
  .kicker {
    display: inline-block; font-size: 11.5px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase;
    color: var(--gold-bright); background: transparent; border: 1px solid var(--gold); padding: 6px 14px; border-radius: 30px; margin-bottom: 26px;
  }
  h1 {
    font-family: 'Fraunces', Georgia, 'Times New Roman', serif;
    font-size: clamp(28px, 6vw, 54px); font-weight: 600; line-height: 1.1; letter-spacing: -0.3px; margin: 0 0 20px;
    text-wrap: balance;
  }
  h1 em { font-style: italic; font-weight: 500; color: var(--gold-bright); }
  .lead {
    font-size: 17px; color: var(--ink-dim); line-height: 1.6; max-width: 540px; margin: 0 auto 36px; font-weight: 500;
  }
  @media (max-width: 480px) {
    h1 { font-size: 24px; line-height: 1.25; }
    .lead { font-size: 14.5px; }
  }

  /* MOCKUP — difuminada en los bordes para que se sienta parte del fondo
     en vez de una foto pegada en una caja. */
  .mockup {
    margin: 10px 0 0;
    position: relative;
  }
  .mockup-image {
    display: block; width: 100%; height: auto;
    -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 16%, black 80%, transparent 100%);
            mask-image: linear-gradient(to bottom, transparent 0%, black 16%, black 80%, transparent 100%);
  }

  /* FORM (por si sigues usando estas clases en tu propio formulario) */
  .optin-card {
    background: var(--bg-panel); border: 1px solid var(--border); border-radius: 16px;
    padding: 28px 24px; max-width: 440px; margin: 0 auto;
  }
  .optin-card .oc-title { font-size: 14px; font-weight: 800; margin-bottom: 4px; }
  .optin-card .oc-sub { font-size: 12.5px; color: var(--ink-dimmer); margin-bottom: 18px; }
  .field { text-align: left; }
  .field label { display: block; font-size: 11px; font-weight: 700; color: var(--ink-dim); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
  .field input {
    width: 100%; background: #0a0908; border: 1.5px solid var(--border); color: var(--ink);
    border-radius: 8px; padding: 13px 14px; font-size: 14.5px; font-family: inherit; font-weight: 500;
  }
  .field input:focus { outline: none; border-color: var(--gold); }
  .field input::placeholder { color: var(--ink-dimmer); }
  .error-msg { font-size: 11.5px; color: #e2775f; margin-top: 4px; display: none; font-weight: 600; }

  .btn-cta {
    margin-top: 6px; width: 100%; border: none; border-radius: 8px; padding: 16px 20px;
    background: linear-gradient(135deg, var(--gold-bright), var(--gold)); color: var(--gold-ink); font-size: 15px; font-weight: 800;
    cursor: pointer; letter-spacing: 0.2px; transition: transform 0.15s ease, box-shadow 0.15s ease;
    box-shadow: 0 10px 30px -10px rgba(215,172,87,0.55);
  }
  .btn-cta:hover { transform: translateY(-1px); box-shadow: 0 14px 34px -10px rgba(215,172,87,0.7); }
  .btn-cta:active { transform: translateY(0); }
  .btn-cta:disabled { opacity: 0.6; cursor: not-allowed; transform: none; box-shadow: none; }

  .trust-line { font-size: 11px; color: var(--ink-dimmer); margin-top: 12px; font-weight: 500; }

  /* SECTIONS */
  section { padding: 56px 0; border-top: 1px solid var(--border); }
  .section-kicker { font-size: 11px; font-weight: 800; letter-spacing: 1.5px; text-transform: uppercase; color: var(--gold); margin-bottom: 10px; }
  h2 {
    font-family: 'Fraunces', Georgia, 'Times New Roman', serif;
    font-size: clamp(24px, 4vw, 33px); font-weight: 600; letter-spacing: -0.2px; margin: 0 0 14px; line-height: 1.2;
    text-wrap: balance;
  }
  .section-sub { color: var(--ink-dim); font-size: 15px; line-height: 1.6; margin-bottom: 32px; max-width: 560px; }

  .cat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  @media (max-width: 560px) { .cat-grid { grid-template-columns: 1fr; } }
  .cat-item {
    border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; background: var(--bg-panel);
    display: flex; align-items: flex-start; gap: 10px;
  }
  .cat-item .n { font-family: 'Fraunces', Georgia, serif; font-size: 12px; font-weight: 700; color: var(--gold-ink); background: var(--gold); border-radius: 50%; width: 22px; height: 22px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
  .cat-item .t { font-size: 13.5px; font-weight: 700; line-height: 1.4; }

  .for-list { display: flex; flex-direction: column; gap: 0; }
  .for-item { display: flex; gap: 12px; padding: 16px 0; border-bottom: 1px solid var(--border); align-items: flex-start; }
  .for-item:last-child { border-bottom: none; }
  .for-item .mark { color: var(--gold); font-weight: 900; font-size: 16px; flex-shrink: 0; }
  .for-item p { margin: 0; font-size: 14.5px; color: var(--ink-dim); line-height: 1.55; }
  .for-item strong { color: var(--ink); }

  .final-cta { text-align: center; padding: 64px 0 72px; }
  .final-cta h2 { max-width: 480px; margin: 0 auto 14px; }
  .final-cta .section-sub { margin-left: auto; margin-right: auto; }

  footer { border-top: 1px solid var(--border); padding: 28px 0 60px; text-align: center; }
  footer p { font-size: 11.5px; color: var(--ink-dimmer); margin: 4px 0; line-height: 1.6; }
</style>

<div class="nav">
  <div class="wrap">
    <div class="brand">100 <span>Ideas</span> de Contenido</div>
    <div class="tag">Recurso gratuito</div>
  </div>
</div>

<div class="wrap" id="lead-magnet-top">
  <section class="hero" style="border-top:none; padding-top:64px; padding-bottom:0;">
    <span class="kicker">PDF gratuito · Descarga inmediata</span>
    <h1>100 ideas de contenido para construir una <em>marca personal</em> con propósito.</h1>
    <p class="lead">Deja de mirar la pantalla en blanco. Guarda este PDF y ten siempre una idea lista para tu próximo reel, carrusel o historia.</p>

    <div class="mockup">
      <img
        src="https://melvinparrales.com/wp-content/uploads/2026/08/a_dark_dramatic_product_mockup_scene_overall_a_s.png"
        alt="100 ideas de contenido para construir una marca personal con propósito"
        class="mockup-image"
        loading="eager"
        fetchpriority="high"
      >
    </div>
  </section>
</div>
